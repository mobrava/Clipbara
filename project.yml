name: Clipbara
options:
  bundleIdPrefix: com.minsang
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  # Developer ID / DMG distribution (Sparkle auto-updates, non-sandboxed dist build)
  Clipbara:
    type: application
    platform: macOS
    sources:
      - path: Clipbara
        excludes:
          - "Info-MAS.plist"
    resources:
      - Clipbara/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.PasteClip
        PRODUCT_NAME: Clipbara
        INFOPLIST_FILE: Clipbara/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clipbara/Clipbara.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Clipbara/Clipbara.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true

  # Mac App Store distribution (sandboxed, no Sparkle)
  ClipbaraMAS:
    type: application
    platform: macOS
    sources:
      - path: Clipbara
        excludes:
          - "Info.plist"
    resources:
      - Clipbara/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.Clipbara
        PRODUCT_NAME: Clipbara
        INFOPLIST_FILE: Clipbara/Info-MAS.plist
        CODE_SIGN_ENTITLEMENTS: Clipbara/Clipbara-MAS.entitlements
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE $(inherited)"
        ENABLE_APP_SANDBOX: "YES"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 5DH57J8HLC
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Clipbara Mac App Store"
    dependencies:
      - package: KeyboardShortcuts
    entitlements:
      path: Clipbara/Clipbara-MAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  # Unhosted unit tests: no app launch, clipboard monitor, or user store access.
  ClipbaraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Clipbara/Utilities/PanelTabShortcut.swift
      - path: Clipbara/Utilities/WheelScrollTranslation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.ClipbaraTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - ClipbaraTests
