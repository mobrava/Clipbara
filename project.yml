name: Clipbara
options:
  bundleIdPrefix: com.minsang
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  # Developer ID / DMG distribution (Sparkle auto-updates, non-sandboxed dist build)
  Clipbara:
    type: application
    platform: macOS
    sources:
      - path: Clipbara
        excludes:
          - "Info-MAS.plist"
      - path: Shared
    resources:
      - Clipbara/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.PasteClip
        PRODUCT_NAME: Clipbara
        INFOPLIST_FILE: Clipbara/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clipbara/Clipbara.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Clipbara/Clipbara.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true

  # Mac App Store distribution (sandboxed, no Sparkle)
  ClipbaraMAS:
    type: application
    platform: macOS
    sources:
      - path: Clipbara
        excludes:
          - "Info.plist"
      - path: Shared
      - path: SyncKit
      # Local StoreKit testing only. Listed so Xcode can open it; never bundled.
      - path: StoreKit/Clipbara.storekit
        buildPhase: none
    resources:
      - Clipbara/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.Clipbara
        PRODUCT_NAME: Clipbara
        INFOPLIST_FILE: Clipbara/Info-MAS.plist
        CODE_SIGN_ENTITLEMENTS: Clipbara/Clipbara-MAS.entitlements
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE $(inherited)"
        CLIPBARA_CLOUDKIT_CONTAINER: iCloud.com.minsang.Clipbara
        CLIPBARA_APS_ENVIRONMENT: development
        ENABLE_APP_SANDBOX: "YES"
      configs:
        Release:
          CLIPBARA_APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 5DH57J8HLC
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Clipbara Mac App Store"
    dependencies:
      - package: KeyboardShortcuts
    entitlements:
      path: Clipbara/Clipbara-MAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: $(CLIPBARA_APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - $(CLIPBARA_CLOUDKIT_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
    scheme:
      # Run with the local StoreKit products (trial + lifetime) instead of the sandbox.
      storeKitConfiguration: StoreKit/Clipbara.storekit
      # Debug-only trial switches, off by default. Tick them in Edit Scheme > Run > Arguments.
      commandLineArguments:
        "-ClipbaraDebugOriginalAppVersion 1.4": false
        "-ClipbaraDebugTrialShiftDays 8": false

  # iOS companion app (local-first, optional iCloud sync)
  ClipbaraiOS:
    type: application
    platform: iOS
    sources:
      - path: ClipbaraiOS
      - path: ClipbaraKit
      - path: Shared
      - path: SyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.Clipbara
        CLIPBARA_CLOUDKIT_CONTAINER: iCloud.com.minsang.Clipbara
        CLIPBARA_APS_ENVIRONMENT: development
        PRODUCT_NAME: Clipbara
        # The iPhone app is App Store only: the trial and unlock (Shared/Store) apply.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE $(inherited)"
        INFOPLIST_FILE: ClipbaraiOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ClipbaraiOS/ClipbaraiOS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DH57J8HLC
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "39"
      configs:
        Release:
          CLIPBARA_APS_ENVIRONMENT: production
    dependencies:
      - target: ClipbaraKeyboard
      - target: ClipbaraShare

  ClipbaraKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ClipbaraKeyboard
      - path: ClipbaraKit
      - path: Shared
      - path: SyncKit/SyncRecords.swift
      - path: SyncKit/SyncImages.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.Clipbara.keyboard
        CLIPBARA_CLOUDKIT_CONTAINER: iCloud.com.minsang.Clipbara
        PRODUCT_NAME: ClipbaraKeyboard
        INFOPLIST_FILE: ClipbaraKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ClipbaraKeyboard/ClipbaraKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DH57J8HLC
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "39"

  ClipbaraShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ClipbaraShare
      - path: ClipbaraKit
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.Clipbara.share
        PRODUCT_NAME: ClipbaraShare
        INFOPLIST_FILE: ClipbaraShare/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ClipbaraShare/ClipbaraShare.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DH57J8HLC
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "39"

  ClipbaraiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ClipbaraiOSUITests
    dependencies:
      - target: ClipbaraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.ClipbaraiOSUITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5DH57J8HLC
        TEST_TARGET_NAME: ClipbaraiOS

  # Unhosted unit tests: no app launch, clipboard monitor, or user store access.
  ClipbaraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Clipbara/Utilities/PanelTabShortcut.swift
      - path: Clipbara/Utilities/WheelScrollTranslation.swift
      - path: Clipbara/Utilities/ReviewPromptPolicy.swift
      - path: Shared/Store/AccessPolicy.swift
      - path: Clipbara/Panel/PanelContentContainer.swift
      - path: Clipbara/Utilities/PasteKeyCode.swift
      - path: Clipbara/Utilities/ClipQueueList.swift
      - path: Clipbara/Services/ClipQueuePasteboard.swift
      - path: Clipbara/Utilities/URLCommand.swift
      - path: Clipbara/Services/ClipUndoStack.swift
      - path: Shared/Models/ClipboardItem.swift
      - path: Shared/Models/Pinboard.swift
      - path: Shared/Models/PinboardEntry.swift
      - path: Shared/Models/ContentType.swift
      - path: Shared/Models/ImageFingerprint.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsang.ClipbaraTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - ClipbaraTests
